# GitHub Pages workflow — COPY ME to `.github/workflows/deploy-demo.yml`
# (a sandbox token can't push workflow files, so this copy lives in demo/)
name: Deploy demo to GitHub Pages

# Publishes the fully static demo (demo/) to GitHub Pages.
# Requires one-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/deploy-demo.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
